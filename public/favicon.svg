<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark base plate -->
  <rect width="64" height="64" rx="16" fill="#06090e" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Outer Shield Frame -->
  <path d="M32 8L50 16V28C50 40 42 49 32 54C22 49 14 40 14 28V16L32 8Z" 
        stroke="url(#cyberGrad)" stroke-width="2.5" fill="#09101b" filter="url(#glow)" />
        
  <!-- Inner Cyber Lock -->
  <rect x="25" y="27" width="14" height="11" rx="2.5" fill="url(#cyberGrad)" />
  <path d="M28 27V22C28 19.7909 29.7909 18 32 18C34.2091 18 36 19.7909 36 22V27" 
        stroke="url(#cyberGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <circle cx="32" cy="31.5" r="1.5" fill="#06090e" />
  <path d="M32 33V35" stroke="#06090e" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Circuit Accent Dots -->
  <circle cx="18" cy="22" r="1.5" fill="#00f0ff" />
  <circle cx="46" cy="22" r="1.5" fill="#00ff9d" />
</svg>
